# Bring up the linux-quick-setup container.
#
#   docker compose up --build                            # build locally + interactive shell
#   docker compose pull && docker compose up --no-build  # use the published image
#   docker compose run --rm dev nvim                     # one-off command
#
# The image defaults to the published ghcr.io/glyochi/linux-quick-setup:latest;
# override with IMAGE / IMAGE_TAG. A local build tags the result with that same
# name, so pulling and building are interchangeable.
#
# CONTAINER_NAME names the container (default: linux-quick-setup). The Compose
# project defaults to linux-quick-setup for direct Compose calls. run_container.sh
# instead sets a project per container name, isolating containers and Pi volumes.
#
# GITHUB_TOKEN is only needed when PI_SYNC_REPO points at a private repo.
#
# The code you edit is mounted from ${CODE_DIR:-.} at /workspace. The image also
# ships a linux-quick-setup checkout at /linux-quick-setup (the nvim config lives
# there, so in-container edits are live and pushable). At every start the
# entrypoint fast-forwards both the Pi config and that checkout to their origin
# branches, pull-only, resetting to the remote when they cannot fast-forward --
# so unpushed edits in /linux-quick-setup are ephemeral. Pi sessions, machine
# state and login persist in named volumes; the baked config, pinned Pi packages
# and Neovim plugins stay in the image.

name: linux-quick-setup

services:
  dev:
    # Optional: name the container yourself, e.g. CONTAINER_NAME=mytool. The name
    # must be unique on the host (so no scaling). With direct Compose calls,
    # changing it within the same project recreates the container; the launcher
    # uses separate projects instead. `docker compose run` one-offs ignore it.
    container_name: ${CONTAINER_NAME:-linux-quick-setup}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:bookworm-slim}
        # tmux version shipped in the image (static build; needs >= 3.5).
        # 3.6b, not 3.7: 3.7 broke `choose-tree` with session groups (see Dockerfile).
        TMUX_VERSION: ${TMUX_VERSION:-3.6b}
        PI_SYNC_REF: ${PI_SYNC_REF:-main}
        # Ref cloned into /linux-quick-setup. Use $(git rev-parse HEAD) for a
        # clean checkout that matches the local tree.
        LQS_REF: ${LQS_REF:-main}
        # Match these to your host ids so files created in /workspace are not root-owned.
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
      # Optional: only needed when PI_SYNC_REPO is private.
      secrets:
        - github_token
    image: ${IMAGE:-ghcr.io/glyochi/linux-quick-setup}:${IMAGE_TAG:-latest}
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      TERM: ${TERM:-xterm-256color}
      # X11 on Linux, or XWayland on Wayland desktops. Host setup: README.md.
      DISPLAY: ${DISPLAY:-}
      QT_QPA_PLATFORM: xcb
      # Keep this a literal, never ${LANG:-...}: tmux only treats a client as UTF-8 when the locale
      # contains "UTF-8", and a host LANG of C/POSIX would reintroduce the glyph mangling.
      LANG: C.UTF-8
      # Optional: only needed for a private config repo; public repos fetch anonymously.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional commit identity for pushes from /linux-quick-setup.
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      PI_SYNC_BRANCH: ${PI_SYNC_BRANCH:-main}
      PI_SYNC_REHYDRATE: ${PI_SYNC_REHYDRATE:-1}
      PI_SYNC_FETCH_TIMEOUT: ${PI_SYNC_FETCH_TIMEOUT:-20}
      # The /linux-quick-setup checkout follows its own branch at every start;
      # LQS_SYNC_REHYDRATE=0 keeps it exactly as baked.
      LQS_SYNC_BRANCH: ${LQS_SYNC_BRANCH:-main}
      LQS_SYNC_REHYDRATE: ${LQS_SYNC_REHYDRATE:-1}
    group_add:
        - "986"
    volumes:
      - ${CODE_DIR:-.}:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - pi-sessions:/home/dev/.pi/agent/sessions
      - pi-state:/home/dev/.pi/agent/state
      # The Pi login persists in this volume; no host file is required.
      - pi-auth:/home/dev/.pi/agent/auth
      # To reuse an existing host login instead, comment the pi-auth line above
      # and uncomment this one. The host file must already exist (a missing path
      # makes Docker create a directory, which breaks pi):
      #   mkdir -p ~/.pi/agent && touch ~/.pi/agent/auth.json && chmod 600 ~/.pi/agent/auth.json
      # - ${PI_AUTH_FILE:-${HOME}/.pi/agent/auth.json}:/home/dev/.pi/agent/auth.json
    command: ["bash", "-l"]

    # Pass through devices here 
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3

volumes:
  pi-sessions:
  pi-state:
  pi-auth:

# Only used when building from a private PI_SYNC_REPO.
secrets:
  github_token:
    environment: GITHUB_TOKEN
