name: Build and publish image

# Manual only. Builds the Debian image and pushes it to GitHub Container Registry
# so it can be pulled without a local build. No repository secrets are needed:
# the pi-config-sync repo is public, so the build is token-free.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: latest
        type: string
      pi_sync_ref:
        description: pi-config-sync ref (branch, tag or commit) to bake
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects uppercase, and the owner is "Glyochi".
      - name: Resolve image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            PI_SYNC_REF=${{ inputs.pi_sync_ref }}
            LQS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: |
          docker run --rm "${{ steps.vars.outputs.image }}:${{ inputs.tag }}" nvim --version | head -1
          docker run --rm "${{ steps.vars.outputs.image }}:${{ inputs.tag }}" pi --version
