# Symlinked to ~/.tmux.conf by install_things.sh. Requires tmux 3.5 or newer.
# Distinguish Shift+Enter, Ctrl+Enter and Enter so TUI apps (pi) can use them.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
# Nested tmux: the client TERM is screen-256color / tmux-256color, not xterm*.
set -as terminal-features 'screen*:extkeys,tmux*:extkeys'
# Copy through OSC 52, which works in a container without X11.
set -g set-clipboard on
